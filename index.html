<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>AEXRON MATH MISSION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-dark:#175E63;
  --teal:#1D8A84;
  --teal-light:#6FC7C0;
  --orange:#F5821F;
  --orange-light:#FFB067;
  --yellow:#FFC93C;
  --coral:#FF6F59;
  --green:#7FBF4D;
  --blue:#3AACD1;
  --cream:#FFF8EC;
  --cream-2:#FFF0D8;
  --ink:#1F3B3C;
  --white:#FFFFFF;
  --shadow: 0 8px 0 rgba(23,94,99,0.18), 0 14px 24px rgba(23,94,99,0.14);
  --radius-lg: 32px;
  --radius-md: 22px;
  --radius-sm: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Quicksand',sans-serif;
  background:
    radial-gradient(circle at 8% 12%, rgba(111,199,192,0.25) 0, transparent 40%),
    radial-gradient(circle at 92% 18%, rgba(245,130,31,0.16) 0, transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(255,201,60,0.22) 0, transparent 45%),
    var(--cream);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:'Quicksand',sans-serif;cursor:pointer;border:none;outline:none;}
button:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:4px solid var(--yellow); outline-offset:2px;}
img{max-width:100%;display:block;}
.hidden{display:none !important;}
#appRoot{min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---------- shapes / decoration ---------- */
.deco-dot{position:absolute;border-radius:50%;opacity:0.5;}
.floaty{animation:floaty 4.5s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0px);}50%{transform:translateY(-10px);}}
@keyframes pop{0%{transform:scale(0.4);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-6deg);}75%{transform:rotate(6deg);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,0.6);}50%{box-shadow:0 0 0 14px rgba(255,201,60,0);}}
@keyframes fallDown{to{transform:translateY(110vh) rotate(360deg);opacity:0.2;}}
@keyframes celebrateBounce{0%,100%{transform:translateY(0) scale(1);}30%{transform:translateY(-22px) scale(1.05);}55%{transform:translateY(0) scale(0.97);}}
.pop-in{animation:pop 0.45s cubic-bezier(.2,1.4,.4,1) both;}
.wiggle{animation:wiggle 0.6s ease-in-out;}
.shake-anim{animation:shake 0.5s ease;}
.celebrate{animation:celebrateBounce 1s ease-in-out infinite;}

/* ---------- header / logo ---------- */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 22px 10px;flex-wrap:wrap;
}
.logo-wrap{display:flex;align-items:center;gap:14px;}
.logo-wrap img{height:64px;width:auto;animation:logoFloat 3.6s ease-in-out infinite; filter:drop-shadow(0 6px 8px rgba(23,94,99,0.28));}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1.5deg) scale(1);}50%{transform:translateY(-7px) rotate(1.5deg) scale(1.03);}}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.icon-btn.home-btn{background:linear-gradient(180deg,var(--orange-light),var(--orange));color:white;}
.icon-btn{
  width:52px;height:52px;border-radius:50%;background:var(--white);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  font-size:24px;transition:transform .15s ease;
}
.icon-btn:active{transform:scale(0.9);}
.mission-progress{display:flex;gap:8px;align-items:center;background:var(--white);padding:8px 14px;border-radius:40px;box-shadow:var(--shadow);}
.prog-dot{width:16px;height:16px;border-radius:50%;background:#E3DCCB;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s ease;}
.prog-dot.done{background:var(--green);}
.prog-dot.current{background:var(--orange);width:22px;height:22px;box-shadow:0 0 0 4px rgba(245,130,31,0.25);}

/* ---------- mission nav bar ---------- */
.mission-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 14px 12px;}
.mission-nav-btn{
  background:var(--white);border-radius:18px;padding:8px 14px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 rgba(23,94,99,0.12);font-family:'Baloo 2';font-weight:700;color:var(--teal-dark);font-size:12px;
  transition:transform .12s ease;min-width:66px;
}
.mission-nav-btn:hover{transform:translateY(-2px);}
.mission-nav-btn:active{transform:translateY(3px);box-shadow:none;}
.mission-nav-btn .mnb-emoji{font-size:22px;}
.mission-nav-btn .mnb-stars{font-size:10px;color:var(--orange);}
.mission-nav-btn.current{background:var(--orange);color:white;box-shadow:0 4px 0 #c9660f;}
.mission-nav-btn.current .mnb-stars{color:#FFE9CE;}
.mission-nav-btn.completed{background:var(--green);color:white;box-shadow:0 4px 0 #5c9538;}
.mission-nav-btn.completed .mnb-stars{color:#EFFFDE;}

/* ---------- feedback toast (correct / wrong) ---------- */
.feedback-toast{
  position:fixed;left:50%;top:16%;transform:translate(-50%,-50%);z-index:150;background:var(--white);
  border-radius:30px;padding:16px 26px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  animation:pop 0.4s cubic-bezier(.2,1.4,.4,1) both; max-width:90vw;
}
.feedback-toast.correct{background:linear-gradient(180deg,#ffffff,#FFF6DC);}
.feedback-toast.wrong{background:linear-gradient(180deg,#ffffff,#FFEFE9);}
.feedback-icon{font-size:42px;}
.feedback-toast.wrong .feedback-icon{animation:thinkBounce 0.9s ease-in-out infinite;}
.feedback-toast.correct .feedback-icon{animation:starSpin 0.6s ease-in-out;}
@keyframes thinkBounce{0%,100%{transform:translateY(0) rotate(-10deg);}50%{transform:translateY(-8px) rotate(10deg);}}
@keyframes starSpin{0%{transform:scale(0.4) rotate(-25deg);}60%{transform:scale(1.35) rotate(12deg);}100%{transform:scale(1) rotate(0deg);}}
.feedback-text{font-family:'Baloo 2';font-weight:700;font-size:19px;color:var(--teal-dark);}
.card.correct-pulse{animation:cardPulse 0.55s ease;}
.card.think-pulse{animation:cardThink 0.6s ease;}
@keyframes cardPulse{0%{box-shadow:var(--shadow);}50%{box-shadow:0 0 0 14px rgba(255,201,60,0.35), var(--shadow);}100%{box-shadow:var(--shadow);}}
@keyframes cardThink{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px) rotate(-0.5deg);}40%{transform:translateX(6px) rotate(0.5deg);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.recount-pulse{animation:recountPulse 0.65s ease;}
@keyframes recountPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

/* ---------- teacher panel ---------- */
.teacher-bar{
  background:var(--teal-dark);color:var(--white);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 18px;font-size:14px;
}
.teacher-bar b{font-family:'Baloo 2';font-weight:700;letter-spacing:.5px;}
.tbtn{
  background:rgba(255,255,255,0.14);color:var(--white);border-radius:14px;
  padding:9px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;
  transition:background .15s ease;
}
.tbtn:hover{background:rgba(255,255,255,0.26);}
.tbtn:active{transform:scale(0.95);}
.tbtn.active{background:var(--orange);}
.tbtn select{background:transparent;color:var(--white);border:none;font-weight:700;font-family:'Quicksand';}
.tbtn select option{color:var(--ink);}
.spacer{flex:1;}
.paused-overlay{
  position:fixed;inset:0;background:rgba(23,59,60,0.55);z-index:50;
  display:flex;align-items:center;justify-content:center;color:white;text-align:center;
}
.paused-card{background:var(--white);color:var(--ink);padding:40px 50px;border-radius:var(--radius-lg);box-shadow:var(--shadow);}

/* ---------- layout ---------- */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 18px 40px;position:relative;}
.card{
  background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:34px 30px;max-width:1000px;width:100%;position:relative;
}
.big-btn{
  font-family:'Baloo 2';font-weight:700;font-size:22px;color:var(--white);
  background:linear-gradient(180deg,var(--orange-light),var(--orange));
  padding:20px 46px;border-radius:60px;box-shadow:0 8px 0 #C9660F, 0 14px 20px rgba(245,130,31,0.35);
  transition:transform .12s ease;
}
.big-btn:hover{transform:translateY(-2px);}
.big-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #C9660F;}
.big-btn.teal{background:linear-gradient(180deg,var(--teal-light),var(--teal));box-shadow:0 8px 0 var(--teal-dark), 0 14px 20px rgba(29,138,132,0.35);}
.big-btn.teal:active{box-shadow:0 3px 0 var(--teal-dark);}
.big-btn.green{background:linear-gradient(180deg,#a3de79,var(--green));box-shadow:0 8px 0 #5c9538, 0 14px 20px rgba(127,191,77,0.35);}
.big-btn.green:active{box-shadow:0 3px 0 #5c9538;}
.big-btn:disabled{opacity:.4;pointer-events:none;}
.pill-btn{
  font-family:'Baloo 2';font-weight:700;font-size:17px;color:var(--teal-dark);
  background:var(--cream-2);padding:12px 22px;border-radius:40px;box-shadow:0 4px 0 #E4C899;
  transition:transform .12s ease;
}
.pill-btn:active{transform:translateY(3px);box-shadow:none;}
.pill-btn.selected{background:var(--yellow);color:var(--ink);}

.footer{
  text-align:center;padding:22px 10px 30px;font-family:'Baloo 2';color:var(--teal-dark);
}
.footer .tag{font-size:16px;font-weight:700;}
.footer .url{font-size:13px;color:var(--orange);font-weight:700;margin-top:4px;}

/* ---------- opening screen ---------- */
.opening-title{font-size:42px;text-align:center;color:var(--teal-dark);margin:6px 0 0;letter-spacing:.5px;}
.opening-sub{font-size:20px;text-align:center;color:var(--orange);font-weight:700;margin:4px 0 18px;font-family:'Baloo 2';}
.mascot{width:150px;height:auto;margin:0 auto;}
.mode-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:22px 0;}
.mode-card{
  background:var(--cream-2);border-radius:var(--radius-md);padding:22px 26px;width:260px;text-align:center;
  box-shadow:0 4px 0 #E4C899;transition:transform .15s ease;
}
.mode-card:hover{transform:translateY(-4px);}
.mode-card.selected{background:var(--yellow);box-shadow:0 4px 0 #E0A800;}
.mode-card .emoji{font-size:44px;}
.mode-card h3{margin:8px 0 4px;color:var(--teal-dark);}
.name-input-row{display:flex;justify-content:center;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap;}
.name-input-row input{
  font-family:'Quicksand';font-weight:700;font-size:17px;padding:12px 18px;border-radius:30px;
  border:3px solid var(--teal-light);width:260px;text-align:center;
}
.mission-icons-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:20px 0;}
.mission-icon-card{
  background:var(--white);border:3px solid var(--cream-2);border-radius:20px;padding:14px 16px;
  width:130px;text-align:center;box-shadow:var(--shadow);transition:transform .15s ease;
}
.mission-icon-card:hover{transform:translateY(-4px) rotate(-1deg);}
.mission-icon-card .num{
  width:26px;height:26px;border-radius:50%;background:var(--teal);color:white;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:13px;
}
.mission-icon-card .emoji{font-size:36px;}
.mission-icon-card .lbl{font-family:'Baloo 2';font-size:14px;color:var(--teal-dark);margin-top:4px;}

/* ---------- generic mission header ---------- */
.mission-banner{
  display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;
}
.mission-banner .emoji-badge{
  width:64px;height:64px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;
  justify-content:center;font-size:32px;box-shadow:var(--shadow);
}
.mission-banner h2{color:var(--teal-dark);font-size:28px;margin:0;}
.mission-banner .sub{color:var(--orange);font-weight:700;font-family:'Baloo 2';font-size:15px;}
.stars-row{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:22px;margin:6px 0;max-width:100%;}
.stars-count-badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:30px;
  padding:6px 18px;font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--teal-dark);
}
.stars-count-badge .big-star{font-size:30px;}
.progress-text{text-align:center;color:var(--teal-dark);font-weight:700;font-family:'Baloo 2';margin-bottom:6px;}

/* ---------- counting dots ---------- */
.dots-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.count-obj{
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--cream-2);box-shadow:0 3px 0 rgba(0,0,0,0.08);opacity:0.35;transform:scale(0.6);
  transition:all .35s cubic-bezier(.2,1.6,.4,1);
}
.count-obj.on{opacity:1;transform:scale(1);}
.count-obj.dot{background:radial-gradient(circle at 35% 30%, var(--teal-light), var(--teal-dark));}
.count-obj.dot2{background:radial-gradient(circle at 35% 30%, var(--orange-light), var(--orange));}
.op-symbol{font-size:40px;font-family:'Baloo 2';color:var(--coral);font-weight:800;padding:0 8px;}

/* ---------- ten-frame (mission2 stage) ---------- */
.tenframe-grid{display:grid;grid-template-columns:repeat(5,56px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin:14px auto;width:max-content;}
.tf-box{width:56px;height:56px;border-radius:12px;border:3px solid var(--teal-light);background:var(--white);transition:all .2s ease;}
.tf-box.filled{background:radial-gradient(circle at 35% 30%,var(--orange-light),var(--orange));border-color:var(--orange);}
.tf-box.need{border-style:dashed;background:var(--cream-2);}

/* ---------- balloons (mission2 subtraction stage) ---------- */
.balloon-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0;min-height:60px;}
.balloon{font-size:40px;transition:all .4s cubic-bezier(.3,1.2,.4,1);}
.balloon.popped{opacity:0;transform:scale(0.2) translateY(-30px) rotate(20deg);}

/* ---------- dice & domino (mission2 dice stage) ---------- */
.die-face{
  width:78px;height:78px;background:var(--white);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,0.12), var(--shadow);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:2px;
}
.die-cell{display:flex;align-items:center;justify-content:center;}
.die-pip{width:12px;height:12px;border-radius:50%;background:var(--teal-dark);}
.domino-tile{display:flex;align-items:center;background:var(--white);border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,0.12), var(--shadow);padding:8px;gap:0;}
.domino-tile .die-face{box-shadow:none;}
.domino-divider{width:3px;align-self:stretch;background:var(--teal-light);border-radius:2px;margin:4px 2px;}

/* ---------- number line (mission2 skip-count stage) ---------- */
.number-line{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:18px 0 10px;}
.nl-mark{width:44px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;}
.nl-mark .nl-num{
  width:34px;height:34px;border-radius:50%;background:var(--cream-2);color:var(--teal-dark);font-family:'Baloo 2';
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s ease;
}
.nl-mark.hit .nl-num{background:var(--yellow);color:var(--ink);}
.nl-bunny{position:absolute;top:-26px;font-size:26px;animation:pop 0.4s cubic-bezier(.2,1.5,.4,1) both;}

/* ---------- action command card (mission1) ---------- */
.command-card{text-align:center;}
.command-icon{font-size:80px;margin:6px 0;}
.command-label{font-size:26px;font-family:'Baloo 2';color:var(--teal-dark);margin-bottom:14px;}
.action-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

/* ---------- addition question (mission2) ---------- */
.add-groups{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0;}
.group-box{background:var(--cream-2);border-radius:20px;padding:16px 18px;min-width:140px;min-height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;}
.answer-row{display:flex;gap:16px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
.answer-btn{
  width:74px;height:74px;border-radius:50%;font-size:30px;font-family:'Baloo 2';font-weight:800;
  background:var(--white);border:4px solid var(--teal-light);color:var(--teal-dark);box-shadow:0 5px 0 var(--teal-light);
  transition:transform .12s ease;
}
.answer-btn:active{transform:translateY(3px);box-shadow:none;}
.answer-btn.correct-flash{background:var(--green);border-color:#5c9538;color:white;box-shadow:0 5px 0 #5c9538;}
.answer-btn.wrong-flash{background:var(--coral);border-color:#d94b39;color:white;animation:shake .5s ease;}
.almost-msg{text-align:center;color:var(--orange);font-family:'Baloo 2';font-size:22px;margin-top:14px;}
.equation-reveal{text-align:center;font-size:32px;font-family:'Baloo 2';color:var(--teal-dark);margin-top:18px;}
.draw-area{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:90px;background:var(--cream-2);border-radius:20px;padding:14px;margin:14px auto;max-width:420px;}
.draw-slot{width:44px;height:44px;border-radius:50%;border:3px dashed var(--teal-light);}
.draw-slot.filled{border-style:solid;background:radial-gradient(circle at 35% 30%,var(--orange-light),var(--orange));}

/* ---------- robot grid (mission3) ---------- */
.robot-stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
.cmd-sequence{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.cmd-chip{
  width:52px;height:52px;border-radius:16px;background:var(--cream-2);display:flex;align-items:center;
  justify-content:center;font-size:26px;box-shadow:0 3px 0 #e4c899;
}
.cmd-chip.doneStep{background:var(--green);color:white;}
.cmd-chip.currentStep{background:var(--yellow);box-shadow:0 0 0 4px rgba(255,201,60,0.5);animation:pulseGlow 1.4s infinite;}
.cmd-chip.hiddenChip{background:var(--teal-dark);color:transparent;}
.grid-wrap{display:grid;gap:8px;background:var(--teal-dark);padding:12px;border-radius:24px;box-shadow:var(--shadow);}
.grid-cell{
  width:62px;height:62px;border-radius:14px;background:var(--white);display:flex;align-items:center;justify-content:center;
  font-size:22px;font-family:'Baloo 2';font-weight:700;color:var(--teal-dark);position:relative;
}
.grid-cell.start{background:var(--coral);color:white;font-size:24px;}
.grid-cell.deco{background:var(--cream-2);color:var(--orange);font-size:26px;}
.grid-cell.pathTrail{background:var(--yellow);}
.robot-token{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;
  transition:all .35s cubic-bezier(.3,1.4,.4,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,0.25));
}
.arrow-pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px;gap:8px;justify-content:center;}
.arrow-btn{
  border-radius:18px;background:var(--teal);color:white;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 var(--teal-dark);transition:transform .1s ease;
}
.arrow-btn:active{transform:translateY(4px);box-shadow:none;}
.arrow-btn:disabled{opacity:.3;pointer-events:none;}
.arrow-btn.highlightNext{background:var(--orange);box-shadow:0 5px 0 #c9660f;animation:pulseGlow 1.2s infinite;}

/* ---------- market (mission4) ---------- */
.basket-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--cream-2);border-radius:20px;
  padding:10px 16px;margin-bottom:10px;box-shadow:0 3px 0 #e4c899;
}
.basket-icon{font-size:30px;}
.basket-items{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.basket-chip{position:relative;background:var(--white);border-radius:10px;padding:4px 8px;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,0.08);}
.qty-badge{position:absolute;top:-6px;right:-6px;background:var(--orange);color:white;font-size:10px;border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;}
.basket-empty{flex:1;color:var(--teal-dark);font-weight:700;font-size:14px;}
.basket-total{font-family:'Baloo 2';font-weight:700;color:var(--teal-dark);}
.basket-balance{font-family:'Baloo 2';font-weight:700;color:var(--orange);}
.market-gate{display:flex;justify-content:center;gap:4px;margin:18px 0;font-size:56px;}
.market-gate .gate-panel{transition:transform .6s ease;}
.market-gate.opening .gate-panel.left{transform:translateX(-40px) rotate(-8deg);}
.market-gate.opening .gate-panel.right{transform:translateX(40px) rotate(8deg);}
.shelf{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:18px 0;}
.product-card{
  background:var(--cream-2);border-radius:20px;padding:16px;width:150px;text-align:center;box-shadow:0 4px 0 #E4C899;
  transition:transform .15s ease;border:4px solid transparent;
}
.product-card.selected{border-color:var(--orange);background:var(--yellow);}
.product-card .picon{font-size:44px;}
.product-card .pname{font-family:'Baloo 2';font-weight:700;color:var(--teal-dark);margin:4px 0 2px;}
.product-card .pprice{color:var(--orange);font-weight:700;font-family:'Baloo 2';}
.token-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.token{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--orange-light),var(--orange));}
.purse{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--cream-2);border-radius:20px;padding:16px;margin:14px 0;}
.purse-token{
  width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--yellow),#e0a800);
  box-shadow:0 3px 0 #b98800;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;
  font-family:'Baloo 2';font-size:18px;transition:all .3s ease;
}
.purse-token.picked{opacity:0.25;transform:scale(0.7);}
.shopkeeper-row{display:flex;justify-content:center;gap:30px;align-items:center;margin:18px 0;flex-wrap:wrap;}
.shopkeeper-box{background:var(--cream-2);border-radius:20px;padding:16px;min-width:140px;min-height:70px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;}

/* ---------- certificate ---------- */
#certCanvasWrap{display:flex;justify-content:center;margin:16px 0;}
#certCanvas{border-radius:18px;box-shadow:var(--shadow);max-width:100%;height:auto;}

/* ---------- confetti ---------- */
.confetti-piece{position:fixed;top:-20px;width:12px;height:16px;z-index:200;pointer-events:none;border-radius:3px;}

/* ---------- mission5 hooray recap ---------- */
.hooray-title{font-family:'Baloo 2';font-weight:800;font-size:32px;color:var(--teal-dark);margin:6px 0 14px;animation:pop 0.5s cubic-bezier(.2,1.4,.4,1) both;}
.badge-board{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.badge-sticker{
  background:linear-gradient(160deg,#fff,var(--cream-2));border-radius:22px;padding:16px 14px;width:120px;
  box-shadow:0 5px 0 #e4c899, var(--shadow); animation:badgePop 0.5s cubic-bezier(.2,1.5,.4,1) both;
}
.badge-emoji{font-size:40px;}
.badge-label{font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--teal-dark);margin-top:4px;}
@keyframes badgePop{0%{transform:scale(0) rotate(-15deg);opacity:0;}70%{transform:scale(1.15) rotate(5deg);opacity:1;}100%{transform:scale(1) rotate(0deg);}}

/* ---------- summary table ---------- */
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;}
.summary-table td{padding:10px 8px;border-bottom:2px solid var(--cream-2);font-weight:700;}
.summary-table td:last-child{text-align:right;color:var(--teal-dark);}

@media print{
  .teacher-bar, .top-actions, .no-print{display:none !important;}
}

@media (max-width:640px){
  .opening-title{font-size:30px;}
  .card{padding:22px 16px;}
  .grid-cell{width:46px;height:46px;font-size:16px;}
  .logo-wrap img{height:48px;}
}
</style>

/* ---------------- Utilities ---------------- */
function $(sel,root){return (root||document).querySelector(sel);}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function shuffle(arr){const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function totalStars(){return S.stars.m1+S.stars.m2+S.stars.m3+S.stars.m4+S.stars.m5;}
/* Renders up to 10 individual stars for small counts (visual, kid-friendly);
   for larger totals, shows one big star + a number badge instead of a
   wall of repeated emoji, so it always fits its container cleanly. */
function starsDisplay(n){
  if(n<=0) return '';
  if(n<=10) return '⭐'.repeat(n);
  return `<span class="stars-count-badge"><span class="big-star">⭐</span> × ${n}</span>`;
}

/* speech */
function speak(text){
  if(S.muted) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* simple tones */
let audioCtx = null;
function tone(freqs, dur){
  if(S.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+dur+0.02);
      t += dur*0.55;
    });
  }catch(e){}
}
function playCorrect(){tone([523.25,659.25,783.99,1046.5],0.16);}
function playTap(){tone([440],0.08);}
function playAlmost(){tone([349.23,329.63],0.22);}
function playCelebrate(){tone([523.25,659.25,783.99,1046.5],0.16);}

function confettiBurst(n){
  n = n || 40;
  const colors = ['#F5821F','#FFC93C','#1D8A84','#FF6F59','#7FBF4D','#3AACD1'];
  const layer = $('#fxLayer');
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = colors[randInt(0,colors.length-1)];
    p.style.transform = `rotate(${randInt(0,360)}deg)`;
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '3px';
    const dur = 1.6+Math.random()*1.2;
    p.style.animation = `fallDown ${dur}s ease-in forwards`;
    p.style.animationDelay = (Math.random()*0.4)+'s';
    layer.appendChild(p);
    setTimeout(()=>p.remove(), (dur+0.5)*1000);
  }
}

function recordDifficult(mission, question){
  S.difficult.push({mission, question, time:Date.now()});
}

/* ---- unified correct / wrong feedback ---- */
function showFeedbackToast(text, type){
  const mainZone = $('#mainZone');
  if(!mainZone) return;
  const existing = mainZone.querySelector('.feedback-toast'); if(existing) existing.remove();
  const icon = type==='wrong' ? '🤔' : '🌟';
  const toast = el(`<div class="feedback-toast ${type}"><div class="feedback-icon">${icon}</div><div class="feedback-text">${text}</div></div>`);
  mainZone.appendChild(toast);
  setTimeout(()=>toast.remove(), type==='wrong'?2200:1500);
}
function pulseObjectsForRecount(){
  document.querySelectorAll('#mainZone .count-obj, #mainZone .group-box').forEach(elm=>{
    elm.classList.add('recount-pulse');
    setTimeout(()=>elm.classList.remove('recount-pulse'), 700);
  });
}
function triggerCorrectBlast(msg){
  playCorrect(); confettiBurst(60);
  showFeedbackToast(msg || 'Fantastic! 🎉', 'correct');
  const card = document.querySelector('#mainZone .card');
  if(card){ card.classList.remove('think-pulse'); void card.offsetWidth; card.classList.add('correct-pulse'); setTimeout(()=>card.classList.remove('correct-pulse'),600); }
}
function triggerWrongThink(msg){
  playAlmost();
  showFeedbackToast(msg || 'Almost! Count again! 🤔', 'wrong');
  pulseObjectsForRecount();
  const card = document.querySelector('#mainZone .card');
  if(card){ card.classList.remove('correct-pulse'); void card.offsetWidth; card.classList.add('think-pulse'); setTimeout(()=>card.classList.remove('think-pulse'),650); }
}

/* ---------------- Rendering shell ---------------- */
function render(){
  renderHeader();
  renderMain();
  renderFooter();
}

function renderHeader(){
  const zone = $('#headerZone');
  const showTeacher = S.mode==='teacher' && S.screen!=='opening';
  const showMissionNav = S.mode && !['opening'].includes(S.screen);
  zone.innerHTML = `
    <div class="top-bar">
      <div class="logo-wrap">
        <img src="${LOGO_SRC}" alt="AEXRON logo" />
      </div>
      <div class="top-actions">
        <button class="icon-btn home-btn" onclick="goHome()" title="Home" aria-label="Go to home screen">🏠</button>
        <button class="icon-btn" onclick="toggleMute()" title="Mute/Unmute" aria-label="Toggle sound">${S.muted?'🔇':'🔊'}</button>
        <button class="icon-btn" onclick="toggleFullscreen()" title="Full screen" aria-label="Full screen">⛶</button>
      </div>
    </div>
    ${showMissionNav ? renderMissionNav() : ''}
    ${showTeacher ? renderTeacherBar() : ''}
    ${S.paused ? `<div class="paused-overlay"><div class="paused-card"><h2>⏸️ Paused</h2><p>Press Resume to continue the mission.</p>
      <button class="big-btn" onclick="togglePause()">▶️ Resume</button></div></div>` : ''}
  `;
}

function renderMissionNav(){
  return `<div class="mission-nav">
    ${MISSIONS.map((m,i)=>{
      const starsN = S.stars[m.key]||0;
      let cls='mission-nav-btn';
      if(i===S.currentMission && !['certificate','teacherSummary','thankyou'].includes(S.screen)) cls+=' current';
      else if(starsN>0) cls+=' completed';
      return `<button class="${cls}" onclick="jumpMission(${i})" title="Go to ${m.label}">
        <span class="mnb-emoji">${m.emoji}</span>
        <span>${m.label}</span>
        <span class="mnb-stars">${starsN>0?'⭐'.repeat(Math.min(starsN,5)):'&nbsp;'}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function renderTeacherBar(){
  return `
  <div class="teacher-bar">
    <b>👩‍🏫 TEACHER MODE</b>
    <button class="tbtn ${S.paused?'active':''}" onclick="togglePause()">${S.paused?'▶️ Start':'⏸️ Pause'}</button>
    <button class="tbtn" onclick="prevActivity()">⬅️ Prev</button>
    <button class="tbtn" onclick="nextActivity()">Next ➡️</button>
    <button class="tbtn" onclick="resetActivity()">🔄 Reset</button>
    <button class="tbtn ${S.showAnswer?'active':''}" onclick="toggleShowAnswer()">${S.showAnswer?'🙈 Hide Answer':'👁️ Show Answer'}</button>
    <button class="tbtn" onclick="replayQuestion()">🔁 Replay</button>
    <select class="tbtn" onchange="jumpMission(this.value)">
      ${MISSIONS.map((m,i)=>`<option value="${i}" ${i===S.currentMission?'selected':''}>${m.emoji} ${m.label}</option>`).join('')}
    </select>
    <span class="spacer"></span>
    <button class="tbtn" onclick="goScreen('teacherSummary')">📊 Summary</button>
  </div>`;
}

function renderFooter(){
  $('#footerZone').innerHTML = `
    <div class="footer">
      <div class="tag">Where Little Curiosities Become Big Discoveries!!</div>
      <div class="url">www.aexron.lk</div>
    </div>`;
}

/* ---------------- Header actions ---------------- */
function toggleMute(){ S.muted=!S.muted; if(S.muted){try{window.speechSynthesis.cancel();}catch(e){}} render(); }
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
}
function togglePause(){ S.paused=!S.paused; render(); }
function toggleShowAnswer(){ S.showAnswer=!S.showAnswer; render(); }
function jumpMission(i){
  S.currentMission=parseInt(i);
  S.screen=MISSIONS[S.currentMission].key;
  ensureMissionInitialized(S.currentMission);
  S.paused=false;
  render();
  speak(`${MISSIONS[S.currentMission].label}!`);
}
function ensureMissionInitialized(i){
  const key = MISSIONS[i].key;
  if(key==='m2' && !S.m2.stage) initM2();
  if(key==='m3' && !S.m3.grid) initM3();
  if(key==='m4' && S.m4.stage===undefined) initM4();
  if(key==='m5' && !S.m5.questions) initM5();
}
function goScreen(scr){ S.screen=scr; render(); }
function goHome(){ S.screen='opening'; S.paused=false; render(); speak('Home!'); }

function nextActivity(){
  if(S.screen==='m1'){ if(S.m1.idx<5){S.m1.idx++; S.m1.counted=false;} else advanceMission(); }
  else if(S.screen==='m2'){ m2TeacherNext(); }
  else if(S.screen==='m3'){ advanceM3Round(true); }
  else if(S.screen==='m4'){ m4NextStageTeacher(); }
  else if(S.screen==='m5'){ advanceM5Question(true); }
  render();
}
function prevActivity(){
  if(S.screen==='m1' && S.m1.idx>0){S.m1.idx--; S.m1.counted=false;}
  else if(S.screen==='m2'){ m2TeacherPrev(); }
  else if(S.screen==='m3' && S.m3.round>0){S.m3.round--; setupM3Round();}
  else if(S.screen==='m4'){ m4PrevStageTeacher(); }
  else if(S.screen==='m5' && S.m5.qIndex>0){S.m5.qIndex--; setupM5Question();}
  render();
}
function resetActivity(){
  resetMissionState(S.currentMission);
  render();
}
function replayQuestion(){
  if(S.screen==='m2') m2TeacherReplay();
  else if(S.screen==='m3') setupM3Round(true);
  else if(S.screen==='m5') setupM5Question();
  else if(S.screen==='m1') S.m1.counted=false;
  render();
}

function resetMissionState(i){
  const key = MISSIONS[i].key;
  if(key==='m1'){ S.m1={idx:0,counted:false,finalAnswered:false}; S.stars.m1=0; }
  if(key==='m2'){ initM2(); S.stars.m2=0; }
  if(key==='m3'){ initM3(); S.stars.m3=0; }
  if(key==='m4'){ initM4(); S.stars.m4=0; }
  if(key==='m5'){ initM5(); S.stars.m5=0; }
  S.screen=key;
}

function advanceMission(){
  if(S.currentMission < MISSIONS.length-1){
    S.currentMission++;
    S.screen = MISSIONS[S.currentMission].key;
    ensureMissionInitialized(S.currentMission);
  } else {
    S.screen = 'certificate';
  }
  render();
}

/* ================================================================
   MAIN ROUTER
   ================================================================ */
function renderMain(){
  const zone = $('#mainZone');
  let html = '';
  switch(S.screen){
    case 'opening': html = screenOpening(); break;
    case 'm1': html = screenM1(); break;
    case 'm2': html = screenM2(); break;
    case 'm3': html = screenM3(); break;
    case 'm4': html = screenM4(); break;
    case 'm5': html = screenM5(); break;
    case 'certificate': html = screenCertificate(); break;
    case 'thankyou': html = screenThankYou(); break;
    case 'teacherSummary': html = screenTeacherSummary(); break;
    default: html = screenOpening();
  }
  zone.innerHTML = html;
  afterRenderHook();
}

function afterRenderHook(){
  if(S.screen==='certificate') drawCertificate();
  if(S.screen==='thankyou' && !S.thankYouCelebrated){
    S.thankYouCelebrated = true;
    playCelebrate(); confettiBurst(50);
  }
  if(S.screen==='m5' && S.m5.questions && S.m5.qIndex>=S.m5.questions.length && !S.m5.celebrated){
    S.m5.celebrated = true;
    playCelebrate(); confettiBurst(70);
  }
}

/* ================================================================
   MISSION 1 — MOVE & COUNT WARM-UP
   ================================================================ */
const M1_COMMANDS = [

  {type:'clapclap', count:[2,3], label:'Clap 2 times, then clap 3 more times', icon:'👏 ➜ 👏'}
];

function screenM1(){
  const step = M1_COMMANDS[S.m1.idx];

    return `

      <div class="mission-banner">

        <div class="emoji-badge">🏃</div>

function dotsHTML(n, cls){
  return Array.from({length:n}).map((_,i)=>`<div class="count-obj ${cls} on" style="opacity:1;transform:scale(1);">${i+1}</div>`).join('');
}
function m1CountTogether(){
  const step = M1_COMMANDS[S.m1.idx];
  const dots = document.querySelectorAll('#m1dots .count-obj');

function m1Done(){

}
function m1FinalAnswer(val){
  if(val===5){
    S.m1.finalAnswered=true; S.stars.m1=1;
    render();
    triggerCorrectBlast('2 + 3 = 5! 🎉');
    speak('Two plus three equals five! Great warm-up!');
  } else {
    recordDifficult('Mission 1','2 + 3 warm-up');
    render();
    triggerWrongThink('Almost! Count again! 🤔');

}
function showAlmostToast(){ triggerWrongThink('Almost! Count again! 🤔'); }

/* ================================================================
   MISSION 2 — COUNT & ADD  (6 stages: addition, ten-frame, bonds,
   subtraction pop, dice & domino, skip counting)
   ================================================================ */
const M2_BANK = [
  {a:2,b:1,total:3,icon:'●',cls:'dot'},
  {a:2,b:2,total:4,icon:'●',cls:'dot'},
  {a:2,b:3,total:5,icon:'●',cls:'dot'},
  {a:3,b:2,total:5,icon:'★',cls:'dot2'},
  {a:3,b:3,total:6,icon:'★',cls:'dot2'},
  {a:4,b:2,total:6,icon:'●',cls:'dot'},
  {a:3,b:4,total:7,icon:'🚗',cls:'dot2'},
  {a:5,b:3,total:8,icon:'●',cls:'dot'},
  {a:5,b:4,total:9,icon:'★',cls:'dot2'},
  {a:5,b:5,total:10,icon:'●',cls:'dot'}
];
const M2_STAGE_ORDER = ['addition','tenframe','bonds','subtraction','dice','skip'];
const M2_STAGE_META = {
  addition:{label:'Count &amp; Add', badge:'➕', color:'var(--orange)'},
  tenframe:{label:'Ten-Frame Fill', badge:'🔟', color:'var(--teal)'},
  bonds:{label:'Number Bonds to 10', badge:'🤝', color:'var(--blue)'},
  subtraction:{label:'Pop &amp; Count', badge:'🎈', color:'var(--coral)'},
  dice:{label:'Dice &amp; Domino Add', badge:'🎲', color:'var(--green)'},
  skip:{label:'Skip Counting Hop', badge:'🐇', color:'var(--yellow)'}
};

function initM2(){
  S.m2 = { stage:'addition' };
  S.stars.m2 = 0;
  m2InitAddition();
}
function m2LevelIndicator(){
  return M2_STAGE_ORDER.map(key=>{
    const meta = M2_STAGE_META[key];
    const active = key===S.m2.stage;
    return `<span style="opacity:${active?1:0.35};font-weight:${active?800:600};">${meta.badge}</span>`;
  }).join(' &nbsp;→&nbsp; ');
}
function m2StageBanner(){
  if(S.m2.stage==='done') return '';
  const meta = M2_STAGE_META[S.m2.stage];
  return `<div style="text-align:center;margin-bottom:8px;">
    <span style="background:${meta.color};color:white;font-family:'Baloo 2';font-weight:700;padding:6px 18px;border-radius:20px;font-size:14px;">${meta.badge} ${meta.label}</span>
  </div>`;
}
function screenM2(){
  if(!S.m2.stage) initM2();
  let body = '';
  if(S.m2.stage==='addition') body = m2ScreenAddition();
  else if(S.m2.stage==='tenframe') body = m2ScreenTenFrame();
  else if(S.m2.stage==='bonds') body = m2ScreenBonds();
  else if(S.m2.stage==='subtraction') body = m2ScreenSubtraction();
  else if(S.m2.stage==='dice') body = m2ScreenDice();
  else if(S.m2.stage==='skip') body = m2ScreenSkip();
  else if(S.m2.stage==='done') return m2ScreenDone();
  return `
  <div class="card pop-in">
    <div class="mission-banner">
      <div class="emoji-badge">➕</div>
      <div><h2>Mission 2: Count &amp; Add</h2><div class="sub">${M2_STAGE_META[S.m2.stage].label}</div></div>
    </div>
    <div class="progress-text">${m2LevelIndicator()} &nbsp; | &nbsp; Stars: ${starsDisplay(S.stars.m2)}</div>
    ${m2StageBanner()}
    ${body}
  </div>`;
}
function m2GoToStage(key){
  S.m2.stage = key;
  if(key==='tenframe' && !S.m2.tenframe) m2InitTenFrame();
  if(key==='bonds' && !S.m2.bonds) m2InitBonds();
  if(key==='subtraction' && !S.m2.subtraction) m2InitSubtraction();
  if(key==='dice' && !S.m2.dice) m2InitDice();
  if(key==='skip' && !S.m2.skip) m2InitSkip();
  render();
}
function m2NextFromStage(){
  const idx = M2_STAGE_ORDER.indexOf(S.m2.stage);
  if(idx < M2_STAGE_ORDER.length-1){ m2GoToStage(M2_STAGE_ORDER[idx+1]); }
  else { S.m2.stage='done'; render(); }
}
/* ---- teacher bar generic controls (work across whichever stage is active) ---- */
function m2TeacherNext(){
  switch(S.m2.stage){
    case 'addition': advanceM2Question(); break;
    case 'tenframe': if(S.m2.tenframe.answered) m2TenFrameNext(); else m2TenFrameCheck(S.m2.tenframe.targets[S.m2.tenframe.round]); break;
    case 'bonds': if(S.m2.bonds.answered) m2BondsNext(); break;
    case 'subtraction': if(S.m2.subtraction.answered) m2SubtractionNext(); break;
    case 'dice': if(S.m2.dice.answered) m2DiceNext(); break;
    case 'skip': if(S.m2.skip.answered) m2SkipNext(); break;
    case 'done': advanceMission(); break;
  }
}
function m2TeacherPrev(){
  const idx = M2_STAGE_ORDER.indexOf(S.m2.stage);
  if(S.m2.stage==='addition' && S.m2.qIndex>0){ S.m2.qIndex--; m2ResetAdditionQuestion(); }
  else if(idx>0){ m2GoToStage(M2_STAGE_ORDER[idx-1]); }
}
function m2TeacherReplay(){
  if(S.m2.stage==='addition') m2ResetAdditionQuestion();
  else if(S.m2.stage==='tenframe'){ S.m2.tenframe.filled=0; S.m2.tenframe.answered=false; }
  else if(S.m2.stage==='bonds'){ S.m2.bonds.answered=false; }
  else if(S.m2.stage==='subtraction'){ S.m2.subtraction.popped=0; S.m2.subtraction.answered=false; }
  else if(S.m2.stage==='dice'){ S.m2.dice.answered=false; }
  else if(S.m2.stage==='skip'){ const seq=S.m2.skip.sequences[S.m2.skip.round]; seq.hopPos=-1; seq.animDone=false; S.m2.skip.answered=false; }
}

function m2TotalScore(){
  let score = S.m2.correctCount||0;
  if(S.m2.tenframe) score += S.m2.tenframe.score||0;
  if(S.m2.bonds) score += S.m2.bonds.score||0;
  if(S.m2.subtraction) score += S.m2.subtraction.score||0;
  if(S.m2.dice) score += S.m2.dice.score||0;
  if(S.m2.skip) score += S.m2.skip.score||0;
  return score;
}
function m2TotalQuestions(){
  return (S.m2.pool? S.m2.pool.length:5) + 2+2+2+2+2; // addition(5) + 2 each for the 5 new stages
}
/* ---------------------------------------------------------------
   STAGE 1: ADDITION (original count & add questions)
   --------------------------------------------------------------- */
function m2InitAddition(){
  S.m2.pool = shuffle(M2_BANK).slice(0,5);
  S.m2.qIndex = 0; S.m2.correctCount=0; S.m2.drawMode=false;
  m2ResetAdditionQuestion();
}
function m2ResetAdditionQuestion(){
  S.m2.answered=false; S.m2.drawSlots=0; S.m2.joined=false;
}
function currentM2Q(){ return S.m2.pool[S.m2.qIndex]; }
function m2ScreenAddition(){
  const q = currentM2Q();
  if(!q) return `<div>Loading...</div>`;
  const options = m2Options(q);
  return `
    <div class="progress-text" style="margin-top:-4px;">Question ${S.m2.qIndex+1} of ${S.m2.pool.length}</div>
    <div style="text-align:center;margin-bottom:10px;">
      <button class="pill-btn ${S.m2.drawMode?'selected':''}" onclick="toggleM2DrawMode()">✏️ Draw the Total ${S.m2.drawMode?'ON':'OFF'}</button>
      <button class="pill-btn" onclick="speak('Count each group, then count them all!')">🔊 Hear it</button>
    </div>
    ${!S.m2.joined ? `
    <div class="add-groups">
      <div class="group-box">${groupObjs(q.a,q.icon,q.cls)}</div>
      <div class="op-symbol">+</div>
      <div class="group-box">${groupObjs(q.b,q.icon,q.cls)}</div>
      <div class="op-symbol">=</div>
      <div class="group-box" style="min-width:70px;">${S.m2.answered?`<span style="font-size:34px;">✅</span>`:'❓'}</div>
    </div>` : `
    <div class="add-groups pop-in">
      <div class="group-box" style="min-width:280px;">${groupObjs(q.total,q.icon,q.cls)}</div>
    </div>
    <div class="equation-reveal pop-in">${q.a} + ${q.b} = ${q.total} 🎉</div>
    `}
    ${(!S.m2.answered && !S.m2.drawMode) ? `
      <div class="answer-row">
        ${options.map(o=>`<button class="answer-btn" onclick="m2Answer(${o})">${o}</button>`).join('')}
      </div>` : ''}
    ${(!S.m2.answered && S.m2.drawMode) ? `
      <div class="draw-area" id="drawArea">
        ${Array.from({length:10}).map((_,i)=>`<div class="draw-slot ${i<S.m2.drawSlots?'filled':''}" onclick="m2DrawTap()"></div>`).join('')}
      </div>
      <div style="text-align:center;">
        <div style="font-weight:700;">You placed: ${S.m2.drawSlots}</div>
        <button class="big-btn" onclick="m2DrawSubmit(${q.total})">✅ Check My Total</button>
        <button class="pill-btn" onclick="S.m2.drawSlots=0; render();">↩️ Clear</button>
      </div>` : ''}
    ${S.showAnswer && !S.m2.answered ? `<div style="text-align:center;margin-top:10px;color:var(--teal);font-weight:700;">Teacher view: correct total is ${q.total}</div>` : ''}
    ${S.m2.answered ? `
      <div style="text-align:center;margin-top:20px;">
        <button class="big-btn" onclick="advanceM2Question()">${S.m2.qIndex+1<S.m2.pool.length? 'Next Question ➡️':'Level Up ➡️ Ten-Frame Fill'}</button>
      </div>` : ''}
  `;
}
function groupObjs(n, icon, cls){
  return Array.from({length:n}).map(()=>`<div class="count-obj ${cls} on" style="opacity:1;transform:scale(1);font-size:${icon.length>1?'26px':'22px'};">${icon}</div>`).join('');
}
function m2Options(q){
  const opts = new Set([q.total]);
  while(opts.size<3){
    let delta = randInt(-2,2); if(delta===0) delta=1;
    let v = q.total+delta;
    if(v>=0 && v<=10) opts.add(v);
  }
  return shuffle(Array.from(opts));
}
function toggleM2DrawMode(){ S.m2.drawMode=!S.m2.drawMode; S.m2.drawSlots=0; render(); }
function m2DrawTap(){
  if(S.m2.drawSlots<10) S.m2.drawSlots++;
  playTap(); render();
}
function m2DrawSubmit(total){
  if(S.m2.drawSlots===total){ m2Correct(); }
  else {
    recordDifficult('Mission 2', `${currentM2Q().a} + ${currentM2Q().b} (draw mode)`);
    triggerWrongThink('Almost! Count again! 🤔');
  }
}
function m2Answer(val){
  const q = currentM2Q();
  if(val===q.total){ m2Correct(); }
  else{
    recordDifficult('Mission 2', `${q.a} + ${q.b}`);
    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b=>{ if(parseInt(b.textContent)===val){ b.classList.add('wrong-flash'); setTimeout(()=>b.classList.remove('wrong-flash'),600);} });
    triggerWrongThink('Almost! Count again! 🤔');
  }
}
function m2Correct(){
  const q = currentM2Q();
  S.m2.joined = true;
  S.m2.answered = true;
  S.m2.correctCount++;
  S.stars.m2++;
  render();
  triggerCorrectBlast(`${q.a} + ${q.b} = ${q.total}! 🎉`);
  speak(`${q.a} plus ${q.b} equals ${q.total}!`);
}
function advanceM2Question(){
  if(S.m2.qIndex+1 < S.m2.pool.length){
    S.m2.qIndex++;
    m2ResetAdditionQuestion();
    render();
  } else {
    m2NextFromStage();
  }
}

/* ---------------------------------------------------------------
   STAGE 2: TEN-FRAME FILL
   --------------------------------------------------------------- */
function m2InitTenFrame(){
  const t1 = randInt(3,9);
  let t2 = randInt(3,9); while(t2===t1) t2 = randInt(3,9);
  S.m2.tenframe = { round:0, total:2, targets:[t1,t2], filled:0, score:0, answered:false };
}
function m2ScreenTenFrame(){
  const tf = S.m2.tenframe;
  const target = tf.targets[tf.round];
  return `
    <div class="progress-text" style="margin-top:-4px;">Round ${tf.round+1} of ${tf.total}</div>
    <div style="text-align:center;font-family:'Baloo 2';font-size:22px;color:var(--teal-dark);margin:8px 0;">Show me the number ${target}!</div>
    <div style="text-align:center;"><button class="pill-btn" onclick="speak('Tap the boxes to show the number ${target}!')">🔊 Hear it</button></div>
    <div class="tenframe-grid">
      ${Array.from({length:10}).map((_,i)=>`<div class="tf-box ${i<tf.filled?'filled':''}" onclick="${tf.answered?'':`m2TenFrameTap(${i})`}"></div>`).join('')}
    </div>
    <div style="text-align:center;font-weight:700;">You filled: ${tf.filled}</div>
    ${!tf.answered ? `
      <div class="action-row">
        <button class="big-btn" onclick="m2TenFrameCheck(${target})">✅ Check</button>

function initM3(){
  S.m3.size = {rows:4, cols:5};

  S.m3.teacherCallsCode = false;

  S.m3.freeRobotPos = {r:0,c:0};
}
function buildM3Grid(){
  const {rows,cols} = S.m3.size;
  const total = rows*cols;
  const cells = Array.from({length:total},()=>({type:'deco', icon: shuffle(['⭐','🔺','🔵','🟩','✨']).slice(0,1)[0]}));
  cells[0] = {type:'start'};
  // pick 10 cells (excluding index0) for numbers 1-10
  const idxs = shuffle(Array.from({length:total-1},(_,i)=>i+1)).slice(0,10);
  idxs.forEach((idx,i)=>{ cells[idx] = {type:'num', value:i+1}; });
  S.m3.grid = cells;
}
function cellAt(r,c){
  const {cols} = S.m3.size;
  return S.m3.grid[r*cols+c];
}
function inBounds(r,c){
  return r>=0 && c>=0 && r<S.m3.size.rows && c<S.m3.size.cols;
}
const DIRS = { UP:{dr:-1,dc:0,icon:'⬆️'}, DOWN:{dr:1,dc:0,icon:'⬇️'}, LEFT:{dr:0,dc:-1,icon:'⬅️'}, RIGHT:{dr:0,dc:1,icon:'➡️'} };

function generateRoute(len){
  let result = bfsRoute(len);
  let attempts = 0;
  while(!result && attempts<25){
    buildM3Grid(); // extremely rare: regenerate grid layout and retry
    result = bfsRoute(len);
    attempts++;
  }
  return result || trivialSafeRoute(len);
}
/* Breadth-first search over exact-length walks from START (0,0).
   Guaranteed consistent: only ever returns a path whose length is exactly
   `len` and whose recorded answer is the value of the cell actually reached
   by that exact path — no separate "intended target" that can desync. */
function bfsRoute(len){
  let frontier = [{r:0,c:0,parent:null,dir:null}];
  for(let step=1; step<=len; step++){
    const next = [];
    const seen = new Set();
    for(const state of frontier){
      for(const dirName of Object.keys(DIRS)){
        const nr = state.r+DIRS[dirName].dr, nc = state.c+DIRS[dirName].dc;
        if(inBounds(nr,nc)){
          const key = nr+','+nc;
          if(!seen.has(key)){
            seen.add(key);
            next.push({r:nr, c:nc, dir:dirName, parent:state});
          }
        }
      }
    }
    frontier = next;
    if(frontier.length===0) break;
  }
  const numStates = frontier.filter(s => cellAt(s.r,s.c).type==='num');
  if(numStates.length===0) return null;
  const chosen = numStates[randInt(0,numStates.length-1)];
  const moves = []; const pathRev = [{r:chosen.r,c:chosen.c}];
  let cur = chosen;
  while(cur.parent){
    moves.push(cur.dir);
    cur = cur.parent;
    pathRev.push({r:cur.r,c:cur.c});
  }
  moves.reverse();
  const path = pathRev.reverse();
  return {moves, path, endR:chosen.r, endC:chosen.c, answer:cellAt(chosen.r,chosen.c).value};
}
/* Ultra-defensive last resort — only used if BFS finds nothing across many
   regenerated grids (should not happen in practice with this grid size). */
function trivialSafeRoute(len){
  const moves=[]; const path=[{r:0,c:0}]; let r=0,c=0;
  for(let i=0;i<len;i++){
    if(inBounds(r,c+1)){ moves.push('RIGHT'); c++; }
    else if(inBounds(r,c-1)){ moves.push('LEFT'); c--; }
    else if(inBounds(r+1,c)){ moves.push('DOWN'); r++; }
    else { moves.push('UP'); r--; }
    path.push({r,c});
  }
  return {moves, path, endR:r, endC:c, answer:cellAt(r,c).value};
}

        <button class="big-btn" onclick="advanceM3Round()">${S.m3.round+1<S.m3.rounds.length?'Next Round ➡️':'Finish Robot Mission 🏁'}</button>
      </div>` : ''}
  </div>`;
}
function toggleTeacherCallsCode(){ S.m3.teacherCallsCode=!S.m3.teacherCallsCode; render(); }
function m3Move(dir){
  const route = S.m3.route;
  if(S.m3.stepPtr>=route.moves.length) return;
  // only allow correct next direction (guided execution keeps robot valid & deterministic)
  const expected = route.moves[S.m3.stepPtr];
  if(dir!==expected && !S.m3.teacherCallsCode){
    // gentle nudge, ignore wrong tap visually
    playAlmost();
    const pad = $('.arrow-pad'); if(pad) pad.classList.add('shake-anim');
    setTimeout(()=>{ if(pad) pad.classList.remove('shake-anim'); }, 400);
    return;
  }
  if(S.m3.teacherCallsCode){
    // in teacher-calls mode, any of the 4 dirs allowed but must stay in bounds; still follow intended sequence using expected for scoring
  }
  const p = S.m3.robotPos;
  const nr = p.r+DIRS[expected].dr, nc = p.c+DIRS[expected].dc;
  if(inBounds(nr,nc)){ p.r=nr; p.c=nc; }
  S.m3.stepPtr++;
  playTap();
  render();
}
function m3Options(correct){
  const opts = new Set([correct]);
  while(opts.size<3){ const v = randInt(1,10); opts.add(v); }
  return shuffle(Array.from(opts));
}
function m3Answer(val){
  const route = S.m3.route;
  if(val===route.answer){

    S.m3.answered=true;
    render();
    triggerCorrectBlast(`Your robot found ${route.answer}! 🎉`);
    speak(`Your robot found the number ${route.answer}!`);
  } else {
    recordDifficult('Mission 3', `Round ${S.m3.round+1} landing number`);
    render();
    triggerWrongThink('Almost! Count again! 🤔');
  }
}

/* ---- cart helpers (support buying the same item more than once) ---- */
function cartFind(cart, id){ return cart.find(x=>x.id===id); }
function cartTotal(cart, catalog){
  return cart.reduce((s,item)=>{
    const p = catalog.find(pp=>pp.id===item.id);
    return s + (p ? p.price*item.qty : 0);
  }, 0);
}
function cartCount(cart){ return cart.reduce((s,i)=>s+i.qty,0); }
function cartAdd(cart, id, catalog, maxTotal, maxItems){
  const p = catalog.find(pp=>pp.id===id);
  if(!p) return false;
  const curTotal = cartTotal(cart, catalog);
  const curCount = cartCount(cart);
  if(maxItems!==undefined && curCount>=maxItems) return false;
  if(curTotal + p.price > maxTotal) return false;
  const existing = cartFind(cart, id);
  if(existing) existing.qty++; else cart.push({id, qty:1});
  return true;
}
function cartRemove(cart, id){
  const existing = cartFind(cart, id);
  if(!existing) return;
  existing.qty--;
  if(existing.qty<=0){ const idx = cart.indexOf(existing); cart.splice(idx,1); }
}

function basketBarHTML(cart, catalog, maxTotal){
  const total = cartTotal(cart, catalog);
  const left = maxTotal - total;
  if(cart.length===0){
    return `<div class="basket-bar"><div class="basket-icon">🧺</div><div class="basket-empty">Your basket is empty — tap items below!</div>
      <div class="basket-balance">💰 Rs.${maxTotal} to spend</div></div>`;
  }
  return `<div class="basket-bar">
    <div class="basket-icon">🧺</div>
    <div class="basket-items">
      ${cart.map(item=>{
        const p = catalog.find(pp=>pp.id===item.id);
        return `<div class="basket-chip">${p.icon}${item.qty>1?`<span class="qty-badge">x${item.qty}</span>`:''}</div>`;
      }).join('')}
    </div>
    <div class="basket-total">Total: Rs.${total}</div>
    <div class="basket-balance">💰 Rs.${left} left</div>
  </div>`;
}

const M5_COUNT_ICONS = ['⭐','🍎','🚗','🎈','🧁','🔵'];
function initM5(){
  const countQ = {type:'count', n: randInt(4,9), icon: M5_COUNT_ICONS[randInt(0,M5_COUNT_ICONS.length-1)]};
  const addQ = M2_BANK[randInt(0,M2_BANK.length-1)];
  const routeQ = generateM5Route();
  const pairQ = buildM5Pairs();
  const bonusQ = m5BuildBonus();
  S.m5 = { qIndex:0, score:0, answered:false, questions:[countQ,addQ,routeQ,pairQ,bonusQ], celebrated:false };
  S.stars.m5 = 0;
}
function m5BuildBonus(){
  // a lively mixed bonus question — a fresh addition question with a fun icon set
  const bank = shuffle(M2_BANK);
  const pick = bank[0];
  return Object.assign({bonus:true}, pick);
}
function generateM5Route(){
  if(!S.m3.grid) initM3();
  const len = 3;
  const route = generateRoute(len);
  return {type:'route', route};
}
function buildM5Pairs(){
  const validPairs = [[2,8],[3,7],[4,6]];
  const correct = validPairs[randInt(0,validPairs.length-1)];
  const correctProducts = [PRODUCTS.find(p=>p.price===correct[0]), PRODUCTS.find(p=>p.price===correct[1])];
  // build 4 choice-pairs, one correct
  const choices = [correctProducts];
  while(choices.length<4){
    const p1 = PRODUCTS[randInt(0,PRODUCTS.length-1)];
    const p2 = PRODUCTS[randInt(0,PRODUCTS.length-1)];
    if(p1.id===p2.id) continue;
    const sum = p1.price+p2.price;
    if(sum===10) continue; // avoid duplicate correct
    choices.push([p1,p2]);
  }
  return {type:'pair', choices: shuffle(choices), correctSum:10};
}
function setupM5Question(){ S.m5.answered=false; }
const M5_THEMES = {
  count:{label:'🔢 Counting Time!', color:'var(--teal)'},
  add:{label:'➕ Addition Adventure!', color:'var(--orange)'},
  route:{label:'🤖 Robot Rewind!', color:'var(--blue)'},
  pair:{label:'💰 Money Match!', color:'var(--green)'},
  bonus:{label:'✨ Bonus Star Round!', color:'var(--coral)'}
};
function m5ThemeFor(q){
  if(q.bonus) return M5_THEMES.bonus;
  if(q.type==='count') return M5_THEMES.count;
  if(q.type==='route') return M5_THEMES.route;
  if(q.type==='pair') return M5_THEMES.pair;
  return M5_THEMES.add;
}
function screenM5(){
  if(!S.m5.questions) initM5();
  if(S.m5.qIndex >= S.m5.questions.length) return screenM5Recap();
  const q = S.m5.questions[S.m5.qIndex];
  const theme = m5ThemeFor(q);
  return `
  <div class="card pop-in">
    <div class="mission-banner">
      <div class="emoji-badge">🏆</div>
      <div><h2>Mission 5: My Findings</h2><div class="sub">Question ${S.m5.qIndex+1} of ${S.m5.questions.length}</div></div>
    </div>
    <div style="text-align:center;margin-bottom:10px;">
      <span style="background:${theme.color};color:white;font-family:'Baloo 2';font-weight:700;padding:6px 18px;border-radius:20px;font-size:14px;">${theme.label}</span>
    </div>
    ${m5QuestionBody(q)}
  </div>`;
}
function m5QuestionBody(q){
  if(q.type==='count'){
    const opts = m5OptionsAround(q.n);
    return `
    <div style="text-align:center;font-family:'Baloo 2';font-size:20px;">How many?</div>
    <div class="dots-row" style="margin:16px 0;">${Array.from({length:q.n}).map(()=>`<div class="count-obj dot2 on" style="opacity:1;transform:scale(1);">${q.icon}</div>`).join('')}</div>
    ${!S.m5.answered ? `<div class="answer-row">${opts.map(o=>`<button class="answer-btn" onclick="m5Answer(${o===q.n})">${o}</button>`).join('')}</div>` : m5Feedback(q.n)}
    `;
  }
  if(q.type==='a'||q.a!==undefined){
    const opts = m5OptionsAround(q.total);
    return `
    <div style="text-align:center;font-family:'Baloo 2';font-size:20px;">${q.bonus?'Lightning add-up!':'Put them together!'}</div>
    <div class="add-groups">
      <div class="group-box">${groupObjs(q.a,q.icon,q.cls)}</div>
      <div class="op-symbol">+</div>
      <div class="group-box">${groupObjs(q.b,q.icon,q.cls)}</div>
      <div class="op-symbol">=</div>
      <div class="group-box">❓</div>
    </div>
    ${!S.m5.answered ? `<div class="answer-row">${opts.map(o=>`<button class="answer-btn" onclick="m5Answer(${o===q.total})">${o}</button>`).join('')}</div>` : m5Feedback(q.total)}
    `;
  }
  if(q.type==='route'){
    const opts = m3Options(q.route.answer);
    const robotShowPos = S.m5.answered ? {r:q.route.endR, c:q.route.endC} : {r:0,c:0};
    return `
    <div style="text-align:center;font-family:'Baloo 2';font-size:20px;">Start at 🚀 START. Where will the robot stop?</div>
    <div class="cmd-sequence" style="margin:10px 0;">${q.route.moves.map(m=>`<div class="cmd-chip">${DIRS[m].icon}</div>`).join('')}<div class="cmd-chip" style="background:var(--coral);color:white;">🛑</div></div>
    ${gridHTML(S.showAnswer||S.m5.answered ? q.route.path : null, robotShowPos)}
    ${!S.m5.answered ? `<div class="answer-row">${opts.map(o=>`<button class="answer-btn" onclick="m5Answer(${o===q.route.answer})">${o}</button>`).join('')}</div>` : m5Feedback(q.route.answer)}
    `;
  }
  if(q.type==='pair'){
    return `
    <div style="text-align:center;font-family:'Baloo 2';font-size:20px;">Which two items make Rs.10?</div>
    <div class="shelf" style="margin-top:14px;">
      ${q.choices.map((pair,i)=>`
        <div class="product-card" onclick="${S.m5.answered?'':`m5PairAnswer(${i})`}">
          <div class="picon">${pair[0].icon}${pair[1].icon}</div>
          <div class="pname">${pair[0].name} + ${pair[1].name}</div>
          <div class="pprice">Rs.${pair[0].price} + Rs.${pair[1].price}</div>
        </div>`).join('')}
    </div>
    ${S.m5.answered ? m5Feedback(null, S.m5.lastCorrect) : ''}
    `;
  }
  return '';
}
function m5OptionsAround(correct){
  const opts = new Set([correct]);
  while(opts.size<3){ const v = Math.max(0,Math.min(10,correct+randInt(-2,2))); opts.add(v); }
  return shuffle(Array.from(opts));
}
function m5Feedback(){
  return `<div style="text-align:center;margin-top:16px;">
    <div class="equation-reveal">${S.m5.lastCorrect?'Great job! 🎉':'Almost! Count again! 🌟'}</div>
    <button class="big-btn" onclick="advanceM5Question()">${S.m5.qIndex+1<S.m5.questions.length?'Next ➡️':'See My Findings 🏆'}</button>
  </div>`;
}
function m5Answer(isCorrect){
  S.m5.lastCorrect = isCorrect;
  S.m5.answered = true;
  if(isCorrect){ S.m5.score++; S.stars.m5++; render(); triggerCorrectBlast('Great job! 🎉'); }
  else { recordDifficult('Mission 5', `Question ${S.m5.qIndex+1}`); render(); triggerWrongThink('Almost! Count again! 🤔'); }
}
function m5PairAnswer(i){
  const q = S.m5.questions[S.m5.qIndex];
  const pair = q.choices[i];
  const isCorrect = pair[0].price+pair[1].price===10;
  m5Answer(isCorrect);
}
function advanceM5Question(){
  S.m5.qIndex++;
  setupM5Question();
  render();
}
function screenM5Recap(){
  const badges = [
    {emoji:'🏃', label:'I Counted!'},
    {emoji:'➕', label:'I Added!'},
    {emoji:'🤖', label:'I Followed a Code!'},
    {emoji:'🛍️', label:'I Used Money!'},
    {emoji:'🔟', label:'I Made Rs.10!'}
  ];
  return `
  <div class="card pop-in" style="text-align:center;">
    <div class="hooray-title">🎉 HOORAY! YOU DID IT! 🎉</div>
    <div class="badge-board">
      ${badges.map((b,i)=>`<div class="badge-sticker" style="animation-delay:${i*0.12}s;"><div class="badge-emoji">${b.emoji}</div><div class="badge-label">${b.label}</div></div>`).join('')}
    </div>
    <div style="font-size:30px;font-family:'Baloo 2';color:var(--orange);margin:18px 0 8px;">MATH IS EVERYWHERE!</div>
    <div class="stars-row">${starsDisplay(totalStars())}</div>
    <div style="margin:8px 0 4px;font-weight:700;color:var(--teal-dark);">You found ${S.m5.score} of ${S.m5.questions.length} answers today!</div>
    <button class="big-btn" onclick="goScreen('certificate')">🎓 Get My Certificate</button>
  </div>`;
}

      <button class="big-btn teal" onclick="goHome()">🏠 Home</button>

let certLogoImg = null;
function drawCertificate(){
  const canvas = $('#certCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  // background
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#FFF8EC'); grad.addColorStop(1,'#FFF0D8');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#1D8A84'; ctx.lineWidth=10; ctx.strokeRect(20,20,W-40,H-40);
  ctx.strokeStyle = '#F5821F'; ctx.lineWidth=3; ctx.strokeRect(36,36,W-72,H-72);

  function draw(){
    ctx.textAlign='center';
    if(certLogoImg){ ctx.drawImage(certLogoImg, W/2-160, 55, 320, 155); }
    ctx.fillStyle='#175E63'; ctx.font='bold 40px Baloo 2, sans-serif';
    ctx.fillText('AEXRON Math Explorer', W/2, 250);
    ctx.font='22px Quicksand, sans-serif'; ctx.fillStyle='#F5821F';
    ctx.fillText('Certificate of Achievement', W/2, 285);

    ctx.font='bold 34px Baloo 2, sans-serif'; ctx.fillStyle='#1F3B3C';
    ctx.fillText(S.childName ? S.childName : 'Young Explorer', W/2, 350);

    ctx.font='18px Quicksand, sans-serif'; ctx.fillStyle='#1F3B3C';
    const dateStr = new Date().toLocaleDateString();
    ctx.fillText('Date: ' + dateStr, W/2, 385);

    ctx.font='54px sans-serif';
    ctx.fillText('⭐', W/2, 440);
    ctx.font='bold 24px Baloo 2, sans-serif'; ctx.fillStyle='#1D8A84';
    ctx.fillText('Total Stars Earned: ' + totalStars(), W/2, 475);

    ctx.font='34px sans-serif';
    ctx.fillText(MISSIONS.map(m=>m.emoji).join('   '), W/2, 530);
    ctx.font='14px Quicksand, sans-serif'; ctx.fillStyle='#1F3B3C';
    ctx.fillText('Move & Count   •   Count & Add   •   Robot Coding   •   Mini Market   •   My Findings', W/2, 555);

    ctx.font='bold 20px Baloo 2, sans-serif'; ctx.fillStyle='#175E63';
    ctx.fillText('Where Little Curiosities Become Big Discoveries!!', W/2, 630);
    ctx.font='14px Quicksand, sans-serif'; ctx.fillStyle='#F5821F';
    ctx.fillText('www.aexron.lk', W/2, 655);
  }
  if(!certLogoImg){
    certLogoImg = new Image();
    certLogoImg.onload = draw;
    certLogoImg.src = LOGO_SRC;
  } else { draw(); }
}
function downloadCertificate(){
  const canvas = $('#certCanvas');
  const link = document.createElement('a');
  link.download = `AEXRON-Certificate-${(S.childName||'explorer').replace(/\s+/g,'_')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
function startNewChild(){
  const keepMode = S.mode;
  Object.assign(S, {
    childName:'', screen:'opening', currentMission:0, stars:{m1:0,m2:0,m3:0,m4:0,m5:0},
    showAnswer:false, difficult:[], paused:false, thankYouCelebrated:false
  });
  S.mode = keepMode;
  S.m1={idx:0,counted:false,finalAnswered:false};
  S.m2={stage:null};
  S.m3={grid:null,size:{rows:4,cols:5},round:0,rounds:[2,3,4,5,6],route:null,robotPos:{r:0,c:0},stepPtr:0,teacherCallsCode:false,answered:false,practiceDone:false,roundStars:[]};
  S.m4={ stage:'intro', purse:10, pickedTokens:0, selectedProduct:null, cart:[], make10Done:false,
        buy1Answered:false, buy2Confirmed:false, challengesCompleted:0,
        roleplay:{ round:0, total:3, score:0, data:null, answered:false } };
  S.m5={qIndex:0,score:0,answered:false,questions:null,celebrated:false};
  render();
}

/* ================================================================
   TEACHER SUMMARY
   ================================================================ */
function screenTeacherSummary(){
  const difficultList = S.difficult.length ? S.difficult.map(d=>`<li>${d.mission}: ${d.question}</li>`).join('') : '<li>None — great job!</li>';
  return `
  <div class="card pop-in">
    <h2 style="color:var(--teal-dark);text-align:center;">📊 Teacher Summary${S.childName?` — ${S.childName}`:''}</h2>
    <table class="summary-table">
      <tr><td>🏃 Warm-up completed</td><td>${S.stars.m1>0?'Yes ✅':'Not yet'}</td></tr>
      <tr><td>➕ Count & Add score</td><td>${m2TotalScore()} / ${m2TotalQuestions()}</td></tr>
      <tr><td>🤖 Robot Coding score</td><td>${S.stars.m3} / 5 rounds</td></tr>
      <tr><td>🛍️ Mini Market challenges completed</td><td>${S.m4.challengesCompleted||0} / 4</td></tr>
      <tr><td>🏆 Final Findings score</td><td>${S.m5.score||0} / ${(S.m5.questions&&S.m5.questions.length)||5}</td></tr>
      <tr><td><b>⭐ Total Stars</b></td><td><b>${totalStars()}</b></td></tr>
    </table>
    <h3 style="color:var(--orange);margin-top:20px;">Questions found difficult:</h3>
    <ul>${difficultList}</ul>
    <div class="action-row">
      <button class="big-btn" onclick="downloadSummary()">⬇️ Download Session (text)</button>
      <button class="big-btn teal" onclick="goScreen(MISSIONS[S.currentMission].key)">↩️ Back to Mission</button>
      <button class="big-btn green" onclick="startNewChild()">🔄 Start New Child</button>
    </div>
  </div>`;
}
function downloadSummary(){
  const lines = [
    `AEXRON MATH MISSION — Session Summary`,
    `Child: ${S.childName||'(not entered)'}`,
    `Date: ${new Date().toLocaleString()}`,
    ``,
    `Warm-up completed: ${S.stars.m1>0?'Yes':'No'}`,
    `Count & Add score: ${m2TotalScore()} / ${m2TotalQuestions()}`,
    `Robot Coding score: ${S.stars.m3} / 5`,
    `Mini Market challenges completed: ${S.m4.challengesCompleted||0} / 4`,
    `Final Findings score: ${S.m5.score||0} / ${(S.m5.questions&&S.m5.questions.length)||5}`,
    `Total stars: ${totalStars()}`,
    ``,
    `Questions found difficult:`,
    ...(S.difficult.length ? S.difficult.map(d=>`- ${d.mission}: ${d.question}`) : ['- None'])
  ];
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `AEXRON-Session-${(S.childName||'session').replace(/\s+/g,'_')}.txt`;
  link.click();
}

/* ---------------- init ---------------- */
render();
</script>
