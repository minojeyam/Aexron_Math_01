</style></head><body>
<header class="top"><div><img id="logo" class="logo" src="aexron-logo.png" alt="AEXRON"><span id="fallback" class="fallback" style="display:none">AEXRON</span></div><h1>AEXRON MARKET ADVENTURE</h1><div class="row"><a class="btn ghost" href="index.html">🏠 Index</a></div></header><nav id="path" class="path"></nav><main id="app" class="app"></main><div id="resultFx"></div><footer class="footer">Where Little Curiosities Become Big Discoveries!!</footer>
<script>
const C={red:['Red','#e84c4f'],green:['Green','#4aaa62'],blue:['Blue','#3e86dc'],orange:['Orange','#f5821f']};
const seed={red:[['Apple','🍎','food'],['Strawberry','🍓','food'],['Tomato','🍅','food'],['Cherries','🍒','food'],['Pepper','🌶️','food'],['Ball','🔴','toy'],['Backpack','🎒','school'],['Car','🚗','wheels'],['Book','📕','school'],['Kite','🪁','toy']],green:[['Pear','🍐','food'],['Melon','🍈','food'],['Broccoli','🥦','food'],['Cucumber','🥒','food'],['Salad','🥗','food'],['Leaf','🍃','nature'],['Pencil','✏️','school'],['Train','🚂','wheels'],['Turtle','🐢','animal'],['Hat','👒','wear']],blue:[['Blueberries','🫐','food'],['Water','💧','food'],['Fish','🐟','animal'],['Whale','🐳','animal'],['Cap','🧢','wear'],['Book','📘','school'],['Pen','🖊️','school'],['Car','🚙','wheels'],['Ball','🔵','toy'],['Diamond','💎','toy']],orange:[['Orange','🍊','food'],['Carrot','🥕','food'],['Pumpkin','🎃','food'],['Juice','🧃','food'],['Basketball','🏀','toy'],['Fox','🦊','animal'],['Bus','🚌','wheels'],['Scissors','✂️','school'],['Bag','👜','wear'],['Flower','🌼','nature']]};
function defaults(){let a=[],id=1;Object.entries(seed).forEach(([cat,x])=>x.forEach((v,i)=>a.push({id:id++,name:v[0],icon:v[1],kind:v[2],cat,price:i+1,on:true,img:''})));return a}
const names=['Price-Tag Detective','Shopping-List Hunt','Guess the Product','More or Less','AEXRON Bank','Mini Market – Grand Finale'];
const S={p:defaults(),stage:0,done:[0,0,0,0,0,0],skip:[],cats:new Set(Object.keys(C)),wallet:0,bank:0,stars:0,basket:[],market:0,role:'Customer',round:1,swap:true,paused:false,show:false,t:0,tid:null,name:'',finding:0,findingScore:0,score:{price:0,list:0,mystery:0,compare:0,bank:0,customer:0,shop:0,remain:0,ten:0},support:[],d:null,h:null,m:null,c:null};
const $=x=>document.querySelector(x),active=()=>S.p.filter(p=>p.on&&S.cats.has(p.cat)),shuffle=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)],tokens=n=>Array.from({length:n},(_,i)=>`<span class="token" aria-label="Rs.1 token ${i+1}">Rs.1</span>`).join('');
function speak(x){if(speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(x.replace(/Rs\./g,'rupees ')))}}
function resultFx(ok,text){let host=$('#resultFx');if(!host)return;let bits=ok?['⭐','✨','🎉','🌟']:['💭','🔍','💡'];host.innerHTML=`<div class="result-pop"><div class="result-card ${ok?'success':'retry'}"><span class="result-icon">${ok?'🎉':'🤔'}</span>${text}</div>${Array.from({length:10},(_,i)=>`<span class="spark" style="left:${10+Math.random()*80}%;top:${15+Math.random()*65}%;--x:${Math.round(Math.random()*160-80)}px;--y:${Math.round(Math.random()*160-80)}px">${bits[i%bits.length]}</span>`).join('')}</div>`;setTimeout(()=>host.innerHTML='',ok?1150:950)}
function prod(p,fn='',show=true){return `<button class="product" style="--c:${C[p.cat][1]}" ${fn?`onclick="${fn}"`:''}><div class="pic">${p.img?`<img src="${p.img}" alt="${p.name}">`:p.icon}</div><div class="name">${p.name}</div><div class="price">Rs.${p.price}</div>${show?`<div class="tokens">${tokens(p.price)}</div>`:''}</button>`}
function head(a,b){return `<h1 class="title">${a}</h1><p class="sub">${b}</p>`}function nav(){return `<div class="row"><button class="btn green" onclick="next()">✓ Complete checkpoint</button><button class="btn ghost" onclick="skip()">Skip for now</button></div>`}
function render(){path();$('#app').innerHTML=S.paused?`<section class="card">${head('⏸️ Paused','Please wait for your teacher.')}</section>`:[detective,hunt,mystery,compare,bank,market,summary][S.stage]()}
function path(){$('#path').innerHTML=names.map((x,i)=>`<button class="cp ${i===S.stage?'on':''} ${S.done[i]?'done':''} ${i>S.stage&&!S.done[i-1]?'lock':''}" onclick="go(${i})"><b>${S.done[i]?'✓':i+1}</b>${x}</button>`).join('')}
function go(i){if(i<=S.stage||S.done.slice(0,i).every(Boolean)){S.stage=i;setup();render()}else speak('Complete or skip the checkpoint first')}
function setup(){if(S.stage===0&&!S.d)newD();if(S.stage===1&&!S.h)newH();if(S.stage===2&&!S.m)newM();if(S.stage===3&&!S.c)newC()}
function next(){S.done[S.stage]=1;if(S.stage<5){if(S.stage===4&&S.wallet!==10)S.wallet=10;S.stage++;setup()}else S.stage=6;render()}function skip(){S.skip.push(S.stage);next()}
function newD(n=S.d?.n||3){let ps=shuffle(active()).slice(0,n);S.d={n,ps,tags:shuffle(ps),matched:[],sel:0}}
function detective(){let d=S.d;return `<section class="card">${head('🔎 Price-Tag Detective','Choose a shuffled tag, then its product.')}<div class="row"><button class="btn ghost" onclick="newD(3);render()">Easy 3</button><button class="btn ghost" onclick="newD(5);render()">Medium 5</button><button class="btn ghost" onclick="newD(10);render()">Challenge 10</button></div><div class="two"><div class="grid">${d.ps.filter(p=>!d.matched.includes(p.id)).map(p=>prod(p,`match(${p.id})`,false)).join('')}</div><div class="grid">${d.tags.filter(p=>!d.matched.includes(p.id)).map(p=>`<button class="product ${d.sel===p.id?'sel':''}" onclick="S.d.sel=${p.id};render()"><b>${p.name}</b><div class="price">Rs.${p.price}</div><div class="tokens">${tokens(p.price)}</div></button>`).join('')}</div></div>${d.matched.length===d.ps.length?`<div class="feedback">Perfect Match! ⭐<br>Cheapest: Rs.${Math.min(...d.ps.map(p=>p.price))} • Most expensive: Rs.${Math.max(...d.ps.map(p=>p.price))}</div>${nav()}`:''}</section>`}
function match(id){if(!S.d.sel)return speak('Choose a price tag first');if(id===S.d.sel){S.d.matched.push(id);S.d.sel=0;S.score.price++;S.stars++;speak('Perfect Match!');resultFx(true,'Perfect Match!');render()}else{speak('Look carefully and try again!');resultFx(false,'Look carefully and try again!');S.support.push('Price matching')}}
function pairs(n){let a=active(),r=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].price+a[j].price===n)r.push([a[i],a[j]]);return r}
function newH(){let ms=[['Find one red product.',b=>b.length===1&&b[0].cat==='red'],['Find one green product.',b=>b.length===1&&b[0].cat==='green'],['Find something costing Rs.4.',b=>b.length===1&&b[0].price===4],['Find something cheaper than Rs.5.',b=>b.length===1&&b[0].price<5],['Find something more expensive than Rs.6.',b=>b.length===1&&b[0].price>6]];[7,8,10].forEach(n=>pairs(n).length&&ms.push([`Find two products costing Rs.${n} altogether.`,b=>b.length===2&&b.reduce((s,p)=>s+p.price,0)===n]));ms.push(['Choose one product from two colour groups.',b=>b.length===2&&b[0].cat!==b[1].cat&&b.reduce((s,p)=>s+p.price,0)<=10]);S.h={ms:shuffle(ms),i:0,b:[],msg:'Choose products.'}}
function hunt(){let h=S.h,m=h.ms[h.i%h.ms.length],sum=h.b.reduce((s,p)=>s+p.price,0);return `<section class="card">${head('🧺 Shopping-List Hunt',m[0])}<div class="row"><button class="btn teal" onclick="speak('${m[0]}')">🔊 Read My Shopping List</button></div><div class="grid">${active().slice(0,20).map(p=>prod(p,`addH(${p.id})`)).join('')}</div><div class="panel"><h3>Basket</h3><div class="row">${h.b.map(p=>prod(p,`removeH(${p.id})`,false)).join('')||'Tap products.'}</div><div class="balance">TOTAL: Rs.${sum}</div><div class="feedback">${h.msg}</div><div class="row"><button class="btn" onclick="checkH()">Check mission</button><button class="btn ghost" onclick="S.h.b=[];render()">Empty</button></div></div>${h.i>=3?nav():''}</section>`}
function addH(id){let p=active().find(x=>x.id===id),sum=S.h.b.reduce((s,x)=>s+x.price,0);if(sum+p.price>10){speak('That total is above 10 rupees');resultFx(false,'Keep the total within Rs.10!');return}if(S.h.b.length<2)S.h.b.push(p);render()}function removeH(id){S.h.b.splice(S.h.b.findIndex(p=>p.id===id),1);render()}function checkH(){let h=S.h;if(h.ms[h.i%h.ms.length][1](h.b)){h.i++;h.b=[];h.msg='Mission complete!';S.score.list++;S.stars++;speak(h.msg);resultFx(true,'Shopping Mission Complete!')}else{h.msg='Check the list and try again!';resultFx(false,'Check the list and try again!');S.support.push('Shopping list')}render()}
function clues(p){return shuffle([`It costs Rs.${p.price}.`,p.kind==='food'?'You can eat or drink it.':p.kind==='school'?'We use it at school.':p.kind==='wheels'?'It has wheels.':`It is a ${p.kind}.`,`It is in the ${p.cat} group.`,p.price<6?'It costs less than Rs.6.':'It costs Rs.6 or more.']).slice(0,3)}
function newM(){let a=pick(active());S.m={a,opts:shuffle([a,...shuffle(active().filter(p=>p.id!==a.id)).slice(0,3)]),clues:clues(a),shown:1,guess:false,count:0,round:(S.m?.round||0)+1}}
function mystery(){let m=S.m;return `<section class="card">${head('🎁 Guess the Product',`Random mystery round ${m.round}`)}<div class="bag">🛍️</div><div class="panel">${m.clues.slice(0,m.shown).map((x,i)=>`<p><b>Clue ${i+1}:</b> ${x}</p>`).join('')}</div>${!m.guess?`<div class="grid">${m.opts.map(p=>prod(p,`guess(${p.id})`,false)).join('')}</div><div class="row"><button class="btn" ${m.shown===3?'disabled':''} onclick="S.m.shown++;render()">NEXT CLUE</button></div>`:`<div class="feedback">${m.a.icon} ${m.a.name}! Count ${m.a.price} Rs.1 tokens.</div><div class="row">${Array.from({length:10},()=>`<button class="token big" onclick="countM()">Rs.1</button>`).join('')}</div><div class="balance">COUNT: ${m.count}</div>`}${S.score.mystery>=3?nav():''}</section>`}
function guess(id){if(id===S.m.a.id){S.m.guess=true;S.score.mystery++;S.stars++;speak('Correct! Count the tokens.');resultFx(true,'Mystery Solved!');render()}else{speak('Use another clue and try again');resultFx(false,'Use another clue!');S.support.push('Mystery clues')}}function countM(){if(S.m.count<S.m.a.price)S.m.count++;if(S.m.count===S.m.a.price){speak('Detective star!');resultFx(true,'Detective Star!');setTimeout(()=>{newM();render()},900)}else render()}
function newC(){let [a,b]=shuffle(active()).slice(0,2);S.c={a,b,type:pick(['more','less','buy','diff','remain'])}}
function compare(){let c=S.c,q={more:'Which costs more?',less:'Which costs less?',buy:'Which can you buy with Rs.5?',diff:'How much more does the expensive product cost?',remain:'Which leaves more money from Rs.10?'}[c.type];return `<section class="card">${head('⚖️ More or Less',q)}<div class="two">${prod(c.a,`pickC(${c.a.id})`)}${prod(c.b,`pickC(${c.b.id})`)}</div><div class="feedback">⚖️ Left product = move left • Right product = move right • Same = centre</div>${c.type==='diff'?`<div class="row">${Array.from({length:10},(_,i)=>`<button class="btn ghost" onclick="diff(${i})">${i}</button>`).join('')}</div>`:''}${S.score.compare>=4?nav():''}</section>`}
function pickC(id){let c=S.c,ok=c.type==='more'?id===(c.a.price>=c.b.price?c.a.id:c.b.id):c.type==='less'||c.type==='remain'?id===(c.a.price<=c.b.price?c.a.id:c.b.id):c.type==='buy'?[c.a,c.b].filter(p=>p.price<=5).some(p=>p.id===id):false;if(ok){S.score.compare++;S.stars++;newC();speak('Correct comparison!');resultFx(true,'Correct Comparison!');render()}else{speak('Compare the Rs.1 circles again');resultFx(false,'Count the circles again!');S.support.push('More or less')}}function diff(n){if(n===Math.abs(S.c.a.price-S.c.b.price)){S.score.compare++;S.stars++;newC();resultFx(true,'You found the difference!');render()}else{speak('Count the difference again');resultFx(false,'Count the difference again!')}}
function bank(){return `<section class="card">${head('🏦 AEXRON Bank','Collect exactly Rs.10 before entering the Mini Market.')}<div class="two"><div class="panel"><div class="bag">🤖</div><div class="row">${Array.from({length:10},(_,i)=>`<button class="token big" ${i<S.bank?'disabled':''} onclick="addBank()">Rs.1</button>`).join('')}</div></div><div class="wallet"><h2 style="color:white">DIGITAL WALLET</h2><div class="tokens">${tokens(S.bank)}</div><div class="balance">BALANCE: Rs.${S.bank}</div><input placeholder="Child name (optional)" value="${S.name}" oninput="S.name=this.value" style="margin:10px;padding:9px"><br><button class="btn" onclick="confirmBank()">Confirm total</button></div></div>${S.wallet===10?`<div class="feedback">🏅 CUSTOMER BADGE • ${S.name||'AEXRON Explorer'}<br>Your Rs.10 is ready! Welcome to the AEXRON Mini Market!</div>${nav()}`:''}<div class="panel"><label><input type="checkbox"> Banker Role-Play Mode: one child gives tokens; another checks Rs.10.</label></div></section>`}
function addBank(){if(S.bank<10){S.bank++;speak(String(S.bank));render()}}function confirmBank(){if(S.bank===10){S.wallet=10;S.score.bank=1;S.stars++;speak('Your 10 rupees is ready! Welcome to the AEXRON Mini Market!');resultFx(true,'Rs.10 Ready!')}else{speak('Count again! You need exactly 10 rupees.');resultFx(false,'Count again! You need exactly Rs.10.');S.support.push('Counting Rs.10')}render()}
const missions=['Buy one product.','Count how much money is left.','Buy two products without spending over Rs.10.','Buy from a specified colour category.','Find two products that make exactly Rs.10.'];
function market(){return `<section class="card">${head('🏪 AEXRON MINI MARKET: GRAND FINALE',`Round ${S.round} • ${S.role} Mode`)}<div class="row between"><span class="balance">BALANCE: Rs.${S.wallet}</span><b>⭐ ${S.stars}</b><button class="btn teal" onclick="swap()">TIME TO SWAP!</button></div><div class="mission"><h3>Mini Market Mission Card</h3>${missions.map((m,i)=>`<div>${i<S.market?'⭐':'⬜'} Mission ${i+1}: ${m}</div>`).join('')}</div>${S.role==='Customer'?customer():shopkeeper()}${S.market>=5?nav():''}</section>`}
function customer(){return `<div class="shops">${Object.keys(C).filter(c=>S.cats.has(c)).map(c=>`<div class="shop" style="--c:${C[c][1]}"><h2 style="color:white">${C[c][0]} Shop</h2>${active().filter(p=>p.cat===c&&p.price<=S.wallet).slice(0,4).map(p=>prod(p,`buy(${p.id})`,false)).join('')}</div>`).join('')}</div><div class="panel"><h3>🧺 Purchased</h3><div class="row">${S.basket.map(p=>prod(p,'',false)).join('')||'Basket empty'}</div></div>`}
function shopkeeper(){if(!S.pending){S.pending=pick(active());S.offer=Math.max(1,Math.min(10,S.pending.price+(Math.random()<.5?0:1)))}return `<div class="two"><div class="panel">Customer wants ${prod(S.pending,'',false)}</div><div class="panel"><h3>Customer offers ${S.offer} tokens</h3><div class="tokens">${tokens(S.offer)}</div></div></div><div class="row"><button class="btn green" onclick="checkShop(true)">Approve</button><button class="btn red" onclick="checkShop(false)">Reject</button></div>`}
function buy(id){let p=active().find(x=>x.id===id);if(p.price>S.wallet){speak('Not enough money');resultFx(false,'Not enough money!');return}let paid=Number(prompt(`Give Rs.1 tokens for ${p.name}. Price Rs.${p.price}. How many tokens?`,p.price));if(paid!==p.price){speak('Let us count the tokens again!');resultFx(false,"Let's count the tokens again!");return}S.wallet-=p.price;S.basket.push(p);S.market=Math.min(5,S.market+1);S.score.customer++;S.score.remain++;if(S.basket.reduce((s,p)=>s+p.price,0)===10)S.score.ten=1;S.stars++;speak('Correct payment!');resultFx(true,'Correct Payment!');render()}
function checkShop(approve){let ok=S.offer===S.pending.price;if(approve===ok){S.score.shop++;S.stars++;speak('Excellent shopkeeper!');resultFx(true,'Excellent Shopkeeper!');S.pending=null}else{speak('Let us count the tokens again!');resultFx(false,"Let's count the tokens again!")}render()}function swap(){if(!S.swap)return;S.role=S.role==='Customer'?'Shopkeeper':'Customer';S.round++;S.wallet=10;S.basket=[];S.market=0;S.pending=null;speak('Time to swap! New customer balance is 10 rupees.');resultFx(true,'TIME TO SWAP!');render()}
function rows(){let r=[['Price-Tag Detective score',S.score.price],['Shopping-List missions completed',S.score.list],['Mystery products identified',S.score.mystery],['More or Less score',S.score.compare],['Ability to count exactly Rs.10',S.score.bank?'Yes':'Not yet'],['Customer missions completed',S.score.customer],['Shopkeeper checks completed',S.score.shop],['Ability to calculate money remaining',S.score.remain?'Yes':'Not yet'],['Ability to make Rs.10',S.score.ten?'Yes':'Not yet'],['Total stars',S.stars],['Activities requiring additional support',[...new Set(S.support)].join(', ')||'None']];return `<table class="summary">${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`}
const findings=[['Which product costs more?',7,3,7],['Which product costs less?',2,8,2],['Match a product with its price.',4,6,4],['Choose something you can buy with Rs.5.',5,8,5],['How much remains after buying a Rs.4 product?',6,4,6],['Which two product prices make Rs.10?',10,9,10],['Was a payment of 4 tokens correct for a Rs.4 product?','Yes','No','Yes']];
function answerFinding(v){let q=findings[S.finding];if(String(v)===String(q[3])){S.findingScore++;S.stars++;speak('Correct!');resultFx(true,'Great Finding!')}else{S.support.push('My Findings question '+(S.finding+1));speak('Almost. Think about the prices again.');resultFx(false,'Almost! Try the next one.')}S.finding++;render()}
function summary(){if(S.finding<findings.length){let q=findings[S.finding];return `<section class="card">${head('🏆 My Findings',`Question ${S.finding+1} of ${findings.length}`)}<div class="feedback">${q[0]}</div><div class="row"><button class="btn ghost" onclick="answerFinding('${q[1]}')">${q[1]}</button><button class="btn ghost" onclick="answerFinding('${q[2]}')">${q[2]}</button></div></section>`}let a=['I matched prices!','I followed a shopping list!','I compared prices!','I counted money!','I managed a budget!','I became a customer!','I became a shopkeeper!','I made exactly Rs.10!'];return `<section class="card">${head('🏆 My Findings',`Market Adventure complete! Findings score: ${S.findingScore}/${findings.length}`)}<div class="grid">${a.map(x=>`<div class="product"><div class="pic">⭐</div><b>${x}</b></div>`).join('')}</div><h2>Teacher Summary</h2>${rows()}<div class="row"><button class="btn teal" onclick="print()">Print</button><button class="btn" onclick="location.reload()">New Session</button><a class="btn ghost" href="index.html">Main App</a></div></section>`}
function answers(){if(S.stage===0)return S.d.ps.map(p=>`${p.name}=Rs.${p.price}`).join('<br>');if(S.stage===2)return `${S.m.a.name}=Rs.${S.m.a.price}`;if(S.stage===3)return `Prices ${S.c.a.price} and ${S.c.b.price}`;return 'Each circle is exactly Rs.1. Bank target: Rs.10.'}
function mgr(p){return `<div class="mgr"><span>${p.img?'🖼️':p.icon}</span><input value="${p.name}" onchange="edit(${p.id},'name',this.value)"><input type="number" min="1" max="10" value="${p.price}" onchange="edit(${p.id},'price',this.value)"><select onchange="edit(${p.id},'cat',this.value)">${Object.keys(C).map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select><input type="checkbox" ${p.on?'checked':''} onchange="edit(${p.id},'on',this.checked)"><input type="file" accept="image/*" onchange="upload(${p.id},this.files[0])"></div>`}
function edit(id,k,v){let p=S.p.find(x=>x.id===id);p[k]=k==='price'?Math.max(1,Math.min(10,+v||1)):v;refresh()}function upload(id,f){if(!f)return;let r=new FileReader;r.onload=()=>{S.p.find(p=>p.id===id).img=r.result;render()};r.readAsDataURL(f)}function resetP(){if(confirm('Reset products?')){S.p=defaults();refresh()}}function refresh(){S.d=S.h=S.m=S.c=null;setup();render()}function cat(k,on){on?S.cats.add(k):S.cats.delete(k);if(!S.cats.size)S.cats.add(k);refresh()}
function timer(n){clearInterval(S.tid);S.t=+n;if(S.t)S.tid=setInterval(()=>{S.t--;if(!S.t){clearInterval(S.tid);speak('Time to swap!')}teacherPanel()},1000)}function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
fetch('index.html').then(r=>r.text()).then(t=>{let m=t.match(/const LOGO_SRC = "(data:image\/png;base64,[^"]+)"/);if(m){$('#logo').src=m[1];$('#fallback').style.display='none'}}).catch(()=>{$('#logo').style.display='none'});newD();render();
</script></body></html>
